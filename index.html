<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Trabajo</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="app">

    <aside class="lateral">
      <div class="marca">
        <span class="marca-icono">◆</span>
        <div>
          <strong>Organizador</strong>
          <small>Control de trabajo</small>
        </div>
      </div>

      <nav id="menu">
        <button class="nav-item" data-vista="inicio"><span>▦</span> Inicio</button>
        <button class="nav-item" data-vista="solicitudes"><span>✉</span> Solicitudes <em class="badge" id="badge-solicitudes"></em></button>
        <button class="nav-item" data-vista="tareas"><span>✔</span> Tareas <em class="badge" id="badge-tareas"></em></button>
        <button class="nav-item" data-vista="transportes"><span>⇄</span> Transportes <em class="badge" id="badge-transportes"></em></button>
        <button class="nav-item" data-vista="contactos"><span>☰</span> Directorio</button>
        <button class="nav-item" data-vista="respaldo"><span>⤓</span> Respaldo</button>
      </nav>

      <div class="lateral-pie">
        <span id="reloj"></span>
      </div>
    </aside>

    <div class="principal">
      <header class="cabecera">
        <div class="buscador">
          <span class="buscador-icono">⌕</span>
          <input type="search" id="busqueda-global" placeholder="Buscar en todo (solicitudes, tareas, salidas, contactos)…" autocomplete="off">
        </div>
        <div class="cabecera-acciones">
          <button class="btn btn-primario" id="btn-nueva-solicitud">+ Solicitud</button>
          <button class="btn" id="btn-nueva-tarea">+ Tarea</button>
          <button class="btn" id="btn-nueva-salida">+ Salida</button>
        </div>
      </header>

      <main id="vista"></main>
    </div>
  </div>

  <dialog id="modal">
    <form method="dialog" id="modal-form">
      <header class="modal-cabecera">
        <h2 id="modal-titulo">Título</h2>
        <button type="button" class="modal-cerrar" data-cerrar-modal>✕</button>
      </header>
      <div class="modal-cuerpo" id="modal-cuerpo"></div>
      <footer class="modal-pie">
        <button type="button" class="btn" data-cerrar-modal>Cancelar</button>
        <button type="submit" class="btn btn-primario" id="modal-guardar">Guardar</button>
      </footer>
    </form>
  </dialog>

  <div id="avisos" class="avisos"></div>

  <script src="js/utilidades.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/contactos.js"></script>
  <script src="js/solicitudes.js"></script>
  <script src="js/tareas.js"></script>
  <script src="js/transportes.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/respaldo.js"></script>
  <script src="js/buscador.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
